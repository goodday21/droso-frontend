name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

# A newer push to the same branch or pull request cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # ChromeHeadless: Chrome is preinstalled on the GitHub-hosted Ubuntu runners.
      - run: npm test

      - run: npm run build

  e2e:
    name: Browser tests (mocked API)
    # Runs only once the unit tests pass: a broken build would fail here as well, only slower.
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright

      # Playwright strips the types without checking them. Once is enough: the job of the
      # integration tests compiles the same directory.
      - name: Type-check the browser tests
        run: npx tsc -p e2e

      # Lists the tests of every project, the integration ones included, without running them.
      - name: Check the ids of the browser tests
        run: npm run e2e:ids

      # Starts the dev server itself (webServer of playwright.config.ts).
      - run: npm run e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  e2e-integration:
    name: Browser tests (real backend)
    # Parallel to the job `e2e`: each one fails on its own.
    needs: unit
    runs-on: ubuntu-latest
    # The administrator that the backend creates on start-up (its database is new on every run),
    # and with which the tests sign in (`e2e/support/backend.ts`).
    env:
      DROSO_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      E2E_ADMIN_EMAIL: admin@example.com
    steps:
      - uses: actions/checkout@v4

      # The backend is a private repository: a read-only deploy key of it is the secret.
      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: goodday21/droso-backend
          ref: main
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          path: droso-backend

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Started first, so that it builds while the browser is installed. The task starts its own
      # PostgreSQL (embedded, no Docker); the secret of the tokens is new on every run.
      - name: Start the backend
        working-directory: droso-backend/backend
        run: |
          export DROSO_JWT_SECRET="$(openssl rand -base64 32)"
          # A new password on every run, for the tests as well; it follows the rules of a registration.
          password="Adm1n-$(openssl rand -hex 12)!"
          echo "::add-mask::$password"
          echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          export DROSO_BOOTSTRAP_ADMIN_PASSWORD="$password"
          nohup ./gradlew bootRunWithPostgres > "$RUNNER_TEMP/backend.log" 2>&1 &

      - uses: ./.github/actions/setup-playwright

      - name: Wait for the backend
        run: |
          for _ in $(seq 1 150); do
            curl -fs http://localhost:8080/api/v1/health > /dev/null && exit 0
            sleep 2
          done
          echo "The backend did not start within 5 minutes:"
          tail -n 100 "$RUNNER_TEMP/backend.log"
          exit 1

      # Starts the dev server itself (webServer of playwright.config.ts).
      - run: npm run e2e:integration

      - name: Upload the report and the log of the backend
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integration
          path: |
            playwright-report
            ${{ runner.temp }}/backend.log
          retention-days: 14
