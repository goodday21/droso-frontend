name: Set up Playwright
description: Installs Node, the dependencies and the Chromium of Playwright, cached by its version.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm

    - run: npm ci
      shell: bash

    - name: Read the Playwright version
      id: playwright
      run: echo "version=$(npx playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      shell: bash

    # The browser of Playwright is cached; the system libraries it needs are not, so they are
    # installed on every run.
    - name: Cache the Playwright browser
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
      shell: bash

    - if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
      shell: bash
